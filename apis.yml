aid: quizlet
name: Quizlet
description: >-
  Quizlet is a San Francisco-based global learning platform offering
  flashcards, practice tests, and AI-powered study tools used by students,
  teachers, and lifelong learners. Core features include user-created and
  expert-verified study sets, Learn mode (adaptive practice), Test mode,
  Match game, Spaced Repetition, and an AI tutor (Q-Chat / Magic Notes)
  that generates flashcards, summaries, practice questions, and
  explanations from uploaded notes, PDFs, slides, and textbooks. Quizlet
  Plus is the company's consumer subscription, and Quizlet for Schools /
  Teachers provides licensed offerings for classrooms. The platform
  integrates with Google Classroom (share-as-assignment) and Canvas
  (embeddable widgets) but does not currently expose a public developer
  API, OpenAPI specification, or SDK — the legacy Developer API 2.0
  (`quizlet.com/api/2.0`) was effectively wound down to partners-only and
  is not openly registrable. Quizlet's GitHub organization
  (`github.com/quizlet`) hosts internal tooling, GitHub Actions, and
  forks of OSS dependencies (HHVM/Hack, PHPUnit, Mockery, Stylus, etc.)
  rather than a developer-facing API platform.
